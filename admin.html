
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة ZAIN STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{background:#080808;padding:20px;text-align:center;border-bottom:2px solid #c9a34b}
h1,h2{color:#d6b45b}
main{max-width:850px;margin:auto;padding:15px}
.panel{background:#202020;border:1px solid #59492a;border-radius:12px;padding:18px;margin:18px 0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;background:#111;color:white;border:1px solid #555;border-radius:7px}
label{color:#d6b45b}
button{padding:11px 16px;border:0;border-radius:7px;cursor:pointer;font-weight:bold;margin:4px}
.primary{background:#c9a34b;color:#111}
.danger{background:#853b3b;color:white}
.secondary{background:#444;color:white}
.item{border-bottom:1px solid #555;padding:12px 0}
.item img{width:65px;height:65px;object-fit:cover;vertical-align:middle;border-radius:7px}
small{color:#bbb}
.hidden{display:none}
#message{padding:12px;color:#e5c36b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
</style>
</head>
<body>
<header>
<h1>ZAIN STORE</h1>
<p>لوحة إدارة المتجر</p>
</header>

<main>
<div id="message">جاري التحقق...</div>

<section id="login" class="panel hidden">
<h2>تسجيل دخول المدير</h2>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button class="primary" id="loginBtn">تسجيل الدخول</button>
</section>

<section id="dashboard" class="hidden">
<div class="row">
<h2>لوحة التحكم</h2>
<button class="secondary" id="logoutBtn">تسجيل الخروج</button>
</div>

<div class="panel">
<h2 id="formTitle">إضافة منتج جديد</h2>
<input id="productId" type="hidden">

<label>اسم المنتج</label>
<input id="name" placeholder="مثال: عطر رجالي">

<label>القسم</label>
<select id="category"></select>

<label>وصف المنتج</label>
<textarea id="description" rows="3" placeholder="وصف المنتج"></textarea>

<div class="row">
<div>
<label>السعر بالجنيه</label>
<input id="price" type="number" min="0" step="0.01">
</div>
<div>
<label>السعر قبل الخصم (اختياري)</label>
<input id="comparePrice" type="number" min="0" step="0.01">
</div>
</div>

<label>رابط صورة المنتج</label>
<input id="image" type="url" placeholder="https://example.com/image.jpg">

<label>الكمية المتاحة في المخزون</label>
<input id="stock" type="number" min="0" value="1">

<label>
<input id="featured" type="checkbox" style="width:auto">
 منتج مميز
</label>

<div class="row">
<button class="primary" id="saveBtn">حفظ المنتج</button>
<button class="secondary" id="cancelBtn">إلغاء التعديل</button>
</div>
</div>

<div class="panel">
<h2>المنتجات الحالية</h2>
<div id="productList">جاري التحميل...</div>
</div>

<div class="panel">
<h2>طلبات العملاء</h2>
<div id="orderList">جاري تحميل الطلبات...</div>
</div>
</section>
</main>

<script>
const URL="https://keemqicaosqmpuwiyozx.supabase.co";
const KEY="sb_publishable_RwzbqsTjw6iQjzc58T3ccg_5d3LnAW_";
const db=window.supabase.createClient(URL,KEY);

const $=id=>document.getElementById(id);

function message(text){$("message").textContent=text}

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function checkAdmin(){
 const {data:{session},error}=await db.auth.getSession();
 if(error)throw error;

 if(!session){
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  message("سجّل الدخول بحساب المدير.");
  return;
 }

 const {data,error:adminError}=await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",session.user.id)
  .maybeSingle();

 if(adminError)throw adminError;

 if(!data){
  await db.auth.signOut();
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  message("هذا الحساب ليس لديه صلاحية مدير.");
  return;
 }

 $("login").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 message("تم تسجيل الدخول بنجاح.");
 await loadCategories();
 await loadProducts();
 await loadOrders();
}

async function login(){
 message("جاري تسجيل الدخول...");
 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){message("تعذر تسجيل الدخول: "+error.message);return;}
 try{await checkAdmin()}catch(e){message("خطأ في التحقق من صلاحيات المدير: "+e.message)}
}

async function loadCategories(){
 const {data,error}=await db.from("categories")
  .select("id,name").eq("is_active",true).order("sort_order");
 if(error){message("تعذر تحميل الأقسام: "+error.message);return;}
 $("category").innerHTML=(data||[]).map(c=>
  `<option value="${safe(c.id)}">${safe(c.name)}</option>`
 ).join("");
}

async function loadProducts(){
 const {data,error}=await db.from("products")
  .select("id,name,description,price,compare_at_price,image_url,stock_quantity,category_id,is_featured,is_active")
  .order("created_at",{ascending:false});

 if(error){$("productList").textContent="تعذر تحميل المنتجات: "+error.message;return;}

 $("productList").innerHTML=(data||[]).map(p=>`
  <div class="item">
   ${p.image_url?`<img src="${safe(p.image_url)}" alt="">`:""}
   <strong>${safe(p.name)}</strong>
   <p>${Number(p.price).toLocaleString("ar-EG")} جنيه
   | المخزون: ${Number(p.stock_quantity)}</p>
   <small>${p.is_active?"نشط":"مخفي"}</small>
   <div>
    <button class="primary" data-edit="${safe(p.id)}">تعديل</button>
    <button class="danger" data-delete="${safe(p.id)}">حذف</button>
   </div>
  </div>
 `).join("")||"لا توجد منتجات حتى الآن.";

 $("productList").querySelectorAll("[data-edit]").forEach(b=>
  b.addEventListener("click",()=>editProduct(b.dataset.edit,data))
 );
 $("productList").querySelectorAll("[data-delete]").forEach(b=>
  b.addEventListener("click",()=>deleteProduct(b.dataset.delete))
 );
}

async function saveProduct(){
 const id=$("productId").value;
 const name=$("name").value.trim();
 const price=Number($("price").value);
 const stock=Number($("stock").value);

 if(!name||$("price").value===""||price<0||
    $("stock").value===""||stock<0||!$("category").value){
  alert("أكمل اسم المنتج والقسم والسعر والمخزون بشكل صحيح.");
  return;
 }

 const payload={
  name,
  category_id:$("category").value,
  description:$("description").value.trim(),
  price,
  compare_at_price:$("comparePrice").value===""?null:Number($("comparePrice").value),
  image_url:$("image").value.trim()||null,
  stock_quantity:stock,
  is_featured:$("featured").checked,
  is_active:true
 };

 message("جاري حفظ المنتج...");
 let result;

 if(id){
  result=await db.from("products").update(payload).eq("id",id);
 }else{
  result=await db.from("products").insert([payload]);
 }

 if(result.error){message("تعذر حفظ المنتج: "+result.error.message);return;}

 resetForm();
 message("تم حفظ المنتج بنجاح.");
 await loadProducts();
}

function editProduct(id,data){
 const p=data.find(x=>x.id===id);
 if(!p)return;
 $("productId").value=p.id;
 $("name").value=p.name||"";
 $("category").value=p.category_id||"";
 $("description").value=p.description||"";
 $("price").value=p.price??"";
 $("comparePrice").value=p.compare_at_price??"";
 $("image").value=p.image_url||"";
 $("stock").value=p.stock_quantity??0;
 $("featured").checked=!!p.is_featured;
 $("formTitle").textContent="تعديل المنتج";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
 if(!confirm("هل أنت متأكد من حذف المنتج؟"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){message("تعذر الحذف: "+error.message);return;}
 message("تم حذف المنتج.");
 await loadProducts();
}

function resetForm(){
 $("productId").value="";
 $("name").value="";
 $("description").value="";
 $("price").value="";
 $("comparePrice").value="";
 $("image").value="";
 $("stock").value=1;
 $("featured").checked=false;
 $("formTitle").textContent="إضافة منتج جديد";
}

async function loadOrders(){
 const {data,error}=await db.from("orders")
  .select("id,customer_name,customer_phone,customer_address,items,total,status,created_at")
  .order("created_at",{ascending:false});

 if(error){$("orderList").textContent="تعذر تحميل الطلبات: "+error.message;return;}

 const statuses={
  pending:"قيد الانتظار",
  confirmed:"تم التأكيد",
  preparing:"قيد التجهيز",
  shipped:"تم الشحن",
  delivered:"تم التسليم",
  cancelled:"ملغي"
 };

 $("orderList").innerHTML=(data||[]).map(o=>`
  <div class="item">
   <strong>طلب رقم: ${safe(o.id)}</strong>
   <p>العميل: ${safe(o.customer_name)}</p>
   <p>الهاتف: ${safe(o.customer_phone)}</p>
   <p>العنوان: ${safe(o.customer_address)}</p>
   <p>الإجمالي: ${Number(o.total).toLocaleString("ar-EG")} جنيه</p>
   <p>الحالة: ${safe(statuses[o.status]||o.status)}</p>
   <details><summary>تفاصيل المنتجات</summary>
    <pre style="white-space:pre-wrap">${safe(JSON.stringify(o.items,null,2))}</pre>
   </details>
   <select data-status="${safe(o.id)}">
    ${Object.entries(statuses).map(([v,t])=>
     `<option value="${v}" ${o.status===v?"selected":""}>${t}</option>`
    ).join("")}
   </select>
   <button class="primary" data-update="${safe(o.id)}">تحديث الحالة</button>
  </div>
 `).join("")||"لا توجد طلبات حتى الآن.";

 $("orderList").querySelectorAll("[data-update]").forEach(b=>{
  b.addEventListener("click",()=>updateOrder(b.dataset.update));
 });
}

async function updateOrder(id){
 const select=$("orderList").querySelector(`[data-status="${CSS.escape(id)}"]`);
 const {error}=await db.from("orders")
  .update({status:select.value}).eq("id",id);
 if(error){message("تعذر تحديث الطلب: "+error.message);return;}
 message("تم تحديث حالة الطلب.");
 await loadOrders();
}

$("loginBtn").addEventListener("click",login);
$("saveBtn").addEventListener("click",saveProduct);
$("cancelBtn").addEventListener("click",resetForm);
$("logoutBtn").addEventListener("click",async()=>{
 await db.auth.signOut();
 location.reload();
});

checkAdmin().catch(e=>message("حدث خطأ: "+e.message));
</script>
</body>
</html>
