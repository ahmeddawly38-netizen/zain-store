<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAIN STORE - الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:18px}
.container{max-width:850px;margin:auto}
h1,h2{color:#d6ad55}
.card{background:#1d1d1d;padding:18px;border-radius:12px;margin:15px 0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #555;border-radius:7px;background:#292929;color:white;font-size:16px}
button{background:#c49a43;color:#111;border:0;padding:12px 18px;border-radius:7px;font-weight:bold;font-size:15px;cursor:pointer;margin:4px}
button.red{background:#a93232;color:white}
button.gray{background:#555;color:white}
.hidden{display:none}
.product,.order{border-bottom:1px solid #444;padding:12px 0}
small{color:#bbb}
#message{padding:12px;color:#f2c76b;white-space:pre-wrap}
img{max-width:75px;max-height:75px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="container">

<h1> ZAIN STORE </h1>
<p>لوحة إدارة المتجر</p>

<div id="login" class="card">
<h2>تسجيل دخول المدير</h2>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">تسجيل الدخول</button>
<div id="message"></div>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>لوحة التحكم</h2>
<button onclick="showProducts()">المنتجات</button>
<button onclick="showOrders()">الطلبات</button>
<button class="gray" onclick="logout()">تسجيل الخروج</button>
</div>

<div id="productsSection" class="card">
<h2>إضافة / تعديل منتج</h2>
<input type="hidden" id="productId">

<label>اسم المنتج</label>
<input id="name" placeholder="اسم المنتج">

<label>القسم</label>
<select id="category"></select>

<label>وصف المنتج</label>
<textarea id="description" placeholder="وصف المنتج"></textarea>

<label>السعر</label>
<input id="price" type="number" min="0" placeholder="السعر">

<label>السعر قبل الخصم (اختياري)</label>
<input id="oldPrice" type="number" min="0" placeholder="السعر القديم">

<label>رابط صورة المنتج</label>
<input id="image" placeholder="رابط الصورة">

<label>الكمية المتاحة</label>
<input id="stock" type="number" min="0" value="0">

<button onclick="saveProduct()">حفظ المنتج</button>
<button class="gray" onclick="clearForm()">إلغاء التعديل</button>

<h2>المنتجات الموجودة</h2>
<div id="productsList">جاري تحميل المنتجات...</div>
</div>

<div id="ordersSection" class="card hidden">
<h2>طلبات العملاء</h2>
<div id="ordersList">جاري تحميل الطلبات...</div>
</div>
</div>

</div>

<script>
const SUPABASE_URL = "https://keemqicaosqmpuwiyozx.supabase.co";
const SUPABASE_KEY = "sb_publishable_RwzbqsTjw6iQjzc58T3ccg_5d3LnAW_";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function message(t){
 document.getElementById("message").textContent=t;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email || !password){message("اكتب البريد وكلمة المرور");return;}

 message("جاري تسجيل الدخول...");
 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){message("خطأ في تسجيل الدخول: "+error.message);return;}

 const {data:admin,error:adminError}=await db
 .from("admin_users")
 .select("user_id")
 .eq("user_id",data.user.id)
 .maybeSingle();

 if(adminError || !admin){
  await db.auth.signOut();
  message("هذا الحساب ليس لديه صلاحية إدارة المتجر");
  return;
 }

 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 loadCategories();
 loadProducts();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

function showProducts(){
 document.getElementById("productsSection").classList.remove("hidden");
 document.getElementById("ordersSection").classList.add("hidden");
}

function showOrders(){
 document.getElementById("productsSection").classList.add("hidden");
 document.getElementById("ordersSection").classList.remove("hidden");
 loadOrders();
}

async function loadCategories(){
 const {data,error}=await db.from("categories")
 .select("id,name").eq("is_active",true).order("sort_order");

 if(error){alert("خطأ الأقسام: "+error.message);return;}

 const select=document.getElementById("category");
 select.innerHTML="";
 (data||[]).forEach(c=>{
  const option=document.createElement("option");
  option.value=c.id;
  option.textContent=c.name;
  select.appendChild(option);
 });
}

async function loadProducts(){
 const box=document.getElementById("productsList");
 box.textContent="جاري تحميل المنتجات...";

 const {data,error}=await db.from("products")
 .select("*,categories(name)").order("created_at",{ascending:false});

 if(error){box.textContent="خطأ: "+error.message;return;}
 if(!data.length){box.textContent="لا توجد منتجات حتى الآن";return;}

 box.innerHTML="";
 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="product";

  const title=document.createElement("strong");
  title.textContent=p.name+" - "+p.price+" جنيه";

  const info=document.createElement("p");
  info.textContent=(p.categories?.name||"بدون قسم")+" | الكمية: "+p.stock_quantity+" | "+(p.is_active?"ظاهر":"مخفي");

  div.append(title,info);

  if(p.image_url){
   const img=document.createElement("img");
   img.src=p.image_url;
   img.alt=p.name;
   div.appendChild(img);
  }

  const edit=document.createElement("button");
  edit.textContent="تعديل";
  edit.onclick=()=>editProduct(p);

  const toggle=document.createElement("button");
  toggle.className="gray";
  toggle.textContent=p.is_active?"إخفاء":"إظهار";
  toggle.onclick=()=>toggleProduct(p);

  const del=document.createElement("button");
  del.className="red";
  del.textContent="حذف";
  del.onclick=()=>deleteProduct(p.id);

  div.append(edit,toggle,del);
  box.appendChild(div);
 });
}

function clearForm(){
 ["productId","name","description","price","oldPrice","image"].forEach(id=>{
  document.getElementById(id).value="";
 });
 document.getElementById("stock").value=0;
}

function editProduct(p){
 document.getElementById("productId").value=p.id;
 document.getElementById("name").value=p.name||"";
 document.getElementById("description").value=p.description||"";
 document.getElementById("price").value=p.price;
 document.getElementById("oldPrice").value=p.compare_at_price||"";
 document.getElementById("image").value=p.image_url||"";
 document.getElementById("stock").value=p.stock_quantity||0;
 document.getElementById("category").value=p.category_id||"";
 window.scrollTo(0,0);
}

async function saveProduct(){
 const id=document.getElementById("productId").value;
 const name=document.getElementById("name").value.trim();
 const category_id=document.getElementById("category").value;
 const price=Number(document.getElementById("price").value);
 const stock_quantity=Number(document.getElementById("stock").value);

 if(!name || !category_id || document.getElementById("price").value==="" || price<0 || stock_quantity<0){
  alert("راجع اسم المنتج والقسم والسعر والكمية");
  return;
 }

 const old=document.getElementById("oldPrice").value;
 const product={
  name,
  category_id,
  description:document.getElementById("description").value.trim(),
  price,
  compare_at_price:old===""?null:Number(old),
  image_url:document.getElementById("image").value.trim()||null,
  stock_quantity
 };

 let result;
 if(id){
  result=await db.from("products").update(product).eq("id",id);
 }else{
  result=await db.from("products").insert(product);
 }

 if(result.error){alert("لم يتم الحفظ: "+result.error.message);return;}

 alert("تم حفظ المنتج بنجاح");
 clearForm();
 loadProducts();
}

async function toggleProduct(p){
 const {error}=await db.from("products")
 .update({is_active:!p.is_active}).eq("id",p.id);

 if(error){alert(error.message);return;}
 loadProducts();
}

async function deleteProduct(id){
 if(!confirm("هل أنت متأكد من حذف المنتج؟"))return;

 const {error}=await db.from("products").delete().eq("id",id);
 if(error){alert("تعذر الحذف: "+error.message);return;}
 loadProducts();
}

async function loadOrders(){
 const box=document.getElementById("ordersList");
 box.textContent="جاري تحميل الطلبات...";

 const {data,error}=await db.from("orders")
 .select("*").order("created_at",{ascending:false});

 if(error){
  box.textContent="حدث خطأ أثناء تحميل الطلبات: "+error.message;
  return;
 }
 if(!data || !data.length){
  box.textContent="لا توجد طلبات حتى الآن";
  return;
 }

 const statusNames={
  pending:"قيد المراجعة",
  confirmed:"تم التأكيد",
  preparing:"جاري التجهيز",
  shipped:"خرج للتوصيل",
  delivered:"تم التسليم",
  cancelled:"ملغي"
 };

 box.innerHTML="";

 data.forEach(o=>{
  const card=document.createElement("div");
  card.className="order";
  card.style.cssText="border:1px solid #555;border-radius:10px;padding:14px;margin:12px 0;background:#252525";

  const heading=const heading=document.createElement("div");
heading.textContent="رقم الطلب: #"+String(o.id).slice(0,8);
heading.style.cssText="color:#d6ad55;font-size:15px;font-weight:bold;background:#333;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:inline-block";
  card.appendChild(heading);

  const date=document.createElement("p");
  date.textContent="تاريخ الطلب: "+(o.created_at?new Date(o.created_at).toLocaleString("ar-EG"):"غير متاح");
  card.appendChild(date);

  const customer=document.createElement("p");
  customer.textContent="اسم العميل: "+(o.customer_name||"غير متاح");
  card.appendChild(customer);

  const phone=document.createElement("p");
  phone.textContent="رقم الهاتف: "+(o.customer_phone||"غير متاح");
  card.appendChild(phone);

  const address=document.createElement("p");
  address.textContent="عنوان التوصيل: "+(o.customer_address||"غير متاح");
  card.appendChild(address);

  if(o.notes){
   const notes=document.createElement("p");
   notes.textContent="ملاحظات العميل: "+o.notes;
   card.appendChild(notes);
  }

  const productsTitle=document.createElement("h4");
  productsTitle.textContent="تفاصيل المنتجات";
  card.appendChild(productsTitle);

  const list=document.createElement("div");

  (Array.isArray(o.items)?o.items:[]).forEach(item=>{
   const row=document.createElement("p");
   const qty=Number(item.quantity||0);
   const price=Number(item.price||0);
   row.textContent=(item.name||"منتج")+" × "+qty+" — "+(price*qty).toLocaleString("ar-EG")+" جنيه";
   list.appendChild(row);
  });

  if(!list.children.length){
   list.textContent="لا توجد تفاصيل منتجات";
  }
  card.appendChild(list);

  const totals=document.createElement("div");
  totals.style.cssText="border-top:1px solid #555;margin-top:10px;padding-top:10px";

  const subtotal=document.createElement("p");
  subtotal.textContent="المجموع الفرعي: "+Number(o.subtotal||0).toLocaleString("ar-EG")+" جنيه";

  const delivery=document.createElement("p");
  delivery.textContent="رسوم التوصيل: "+Number(o.delivery_fee||0).toLocaleString("ar-EG")+" جنيه";

  const total=document.createElement("h3");
  total.style.color="#d6ad55";
  total.textContent="الإجمالي: "+Number(o.total||0).toLocaleString("ar-EG")+" جنيه";

  totals.append(subtotal,delivery,total);
  card.appendChild(totals);

  const statusLabel=document.createElement("label");
  statusLabel.textContent="حالة الطلب: ";

  const status=document.createElement("select");
  status.style.width="100%";

  ["pending","confirmed","preparing","shipped","delivered","cancelled"].forEach(s=>{
   const option=document.createElement("option");
   option.value=s;
   option.textContent=statusNames[s];
   if(s===o.status)option.selected=true;
   status.appendChild(option);
  });

  statusLabel.appendChild(status);
  card.appendChild(statusLabel);

  const save=document.createElement("button");
  save.textContent="حفظ حالة الطلب";

  save.onclick=async()=>{
   save.disabled=true;
   save.textContent="جاري الحفظ...";

   const {error}=await db.from("orders")
    .update({status:status.value}).eq("id",o.id);

   if(error){
    alert("تعذر تحديث الحالة: "+error.message);
    save.disabled=false;
    save.textContent="حفظ حالة الطلب";
    return;
   }

   alert("تم تحديث حالة الطلب بنجاح");
   loadOrders();
  };

  card.appendChild(save);
  const whatsapp=document.createElement("button");
whatsapp.textContent="مراسلة العميل عبر واتساب";
whatsapp.style.cssText="background:#25D366;color:white;width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;cursor:pointer";

whatsapp.onclick=()=>{
 const phone=String(o.customer_phone||"").replace(/\D/g,"");
 if(!phone){
  alert("رقم العميل غير متاح");
  return;
 }
 const message=encodeURIComponent("أهلاً "+(o.customer_name||"بحضرتك")+"، بخصوص طلبك رقم "+String(o.id).slice(0,8)+" من ZAIN STORE.");
 window.open("https://wa.me/"+(phone.startsWith("0")?"20"+phone.slice(1):phone)+"?text="+message,"_blank");
};

card.appendChild(whatsapp);
  box.appendChild(card);
 });
}

</script>
</body>
</html>
