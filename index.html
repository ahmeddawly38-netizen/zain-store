<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAIN STORE | زين ستور</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:Arial,sans-serif;
}

header{
 text-align:center;
 padding:25px;
 background:#080808;
 border-bottom:2px solid #c9a34b;
}

header p{color:#aaa}

h2{
 color:#d6b45b;
 text-align:center;
}

nav{
 display:flex;
 gap:8px;
 justify-content:center;
 flex-wrap:wrap;
 padding:15px;
}

nav button{
 background:#222;
 color:#d6b45b;
 border:1px solid #b89543;
 padding:10px 14px;
 border-radius:20px;
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
 gap:14px;
 padding:15px;
}

.product{
 background:#202020;
 border:1px solid #514326;
 border-radius:12px;
 padding:12px;
 text-align:center;
}

.product img{
 width:100%;
 height:165px;
 object-fit:cover;
 border-radius:8px;
 background:#333;
}

.price{
 color:#e5c36b;
 font-weight:bold;
}

button{cursor:pointer}

.add,.checkout{
 background:#c9a34b;
 color:#111;
 border:0;
 padding:11px;
 border-radius:7px;
 font-weight:bold;
}

.add{width:100%}

.cart{
 margin:15px;
 padding:18px;
 background:#202020;
 border-radius:12px;
}

.cart-line{
 display:flex;
 justify-content:space-between;
 gap:8px;
 padding:8px 0;
 border-bottom:1px solid #444;
}

.remove{
 background:#633;
 color:white;
 border:0;
 border-radius:5px;
 padding:5px;
}

.checkout{
 width:100%;
 font-size:16px;
}

footer{
 text-align:center;
 padding:25px;
 color:#aaa;
}

#message{
 text-align:center;
 color:#d6b45b;
 padding:15px;
}

/* نموذج إتمام الطلب */

.checkout-modal{
 position:fixed;
 inset:0;
 z-index:9999;
 background:rgba(0,0,0,.85);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 overflow-y:auto;
}

.checkout-box{
 background:#171717;
 border:1px solid #c9a34a;
 border-radius:18px;
 padding:25px 20px;
 width:100%;
 max-width:420px;
 color:#fff;
 position:relative;
 box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.checkout-box h2{
 color:#d6b45c;
 text-align:center;
 margin:5px 0 8px;
}

.checkout-box p{
 color:#aaa;
 text-align:center;
 margin-bottom:22px;
}

.checkout-close{
 position:absolute;
 top:10px;
 left:12px;
 background:none;
 border:none;
 color:#d6b45c;
 font-size:30px;
 cursor:pointer;
}

.checkout-box label{
 display:block;
 color:#d6b45c;
 margin:14px 0 7px;
}

.checkout-box input,
.checkout-box textarea{
 width:100%;
 box-sizing:border-box;
 padding:13px;
 border:1px solid #444;
 border-radius:9px;
 background:#242424;
 color:#fff;
 font-size:15px;
 outline:none;
 font-family:inherit;
}

.checkout-box input:focus,
.checkout-box textarea:focus{
 border-color:#d6b45c;
}

.checkout-box textarea{
 min-height:90px;
 resize:vertical;
}

.checkout-submit{
 width:100%;
 margin-top:22px;
 padding:14px;
 border:none;
 border-radius:9px;
 background:linear-gradient(135deg,#e3c36d,#b58a32);
 color:#171717;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.checkout-submit:disabled{
 opacity:.6;
 cursor:not-allowed;
}

@media(max-width:480px){
 .checkout-box{
  padding:23px 16px;
 }
 .product img{
  height:145px;
 }
}
</style>
</head>

<body>

<header>
 <img src="zain-logo.png" alt="ZAIN STORE"
 style="width:180px;max-width:80%;height:auto;">
 <p>أناقتك تبدأ من هنا ✨</p>
</header>

<nav id="categories">
 <button data-category="all">كل المنتجات</button>
</nav>

<h2>منتجاتنا</h2>

<div id="message">جاري تحميل المنتجات...</div>
<div class="products" id="products"></div>

<div class="cart">
 <h2>🛒 سلة المشتريات</h2>
 <div id="cartItems">السلة فارغة</div>
 <h3 id="total">الإجمالي: 0 جنيه</h3>
 <button class="checkout" onclick="checkout()">
  إتمام الطلب عبر واتساب
 </button>
</div>

<footer>© ZAIN STORE - جميع الحقوق محفوظة</footer>

<!-- نموذج بيانات العميل -->

<div id="checkoutModal" class="checkout-modal" style="display:none;">
 <div class="checkout-box">

  <button type="button" class="checkout-close"
   onclick="closeCheckout()">×</button>

  <h2>إتمام الطلب</h2>
  <p>من فضلك أدخل بيانات التوصيل</p>

  <form id="checkoutForm" onsubmit="submitCheckout(event)">

   <label for="customerName">الاسم بالكامل</label>
   <input id="customerName" type="text"
    placeholder="اكتب اسمك بالكامل" required>

   <label for="customerPhone">رقم الهاتف</label>
   <input id="customerPhone" type="tel"
    placeholder="01xxxxxxxxx" required>

   <label for="customerAddress">عنوان التوصيل</label>
   <textarea id="customerAddress"
    placeholder="اكتب عنوانك بالتفصيل" required></textarea>

   <button type="submit" class="checkout-submit">
    تأكيد الطلب
   </button>

  </form>
 </div>
</div>

<script>
const SUPABASE_URL="https://keemqicaosqmpuwiyozx.supabase.co";
const SUPABASE_KEY="sb_publishable_RwzbqsTjw6iQjzc58T3ccg_5d3LnAW_";
const WHATSAPP="201013740837";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let products=[];
let cart=[];
let selectedCategory="all";

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

async function loadStore(){
 try{
  const [catResult,productResult]=await Promise.all([
   db.from("categories")
    .select("id,name")
    .eq("is_active",true)
    .order("sort_order"),

   db.from("products")
    .select("id,name,description,price,image_url,stock_quantity,category_id")
    .eq("is_active",true)
    .order("created_at",{ascending:false})
  ]);

  if(catResult.error) throw catResult.error;
  if(productResult.error) throw productResult.error;

  products=productResult.data||[];

  const nav=document.getElementById("categories");

  nav.innerHTML='<button data-category="all">كل المنتجات</button>';

  (catResult.data||[]).forEach(c=>{
   const b=document.createElement("button");
   b.textContent=c.name;
   b.dataset.category=c.id;
   nav.appendChild(b);
  });

  nav.querySelectorAll("button").forEach(b=>{
   b.addEventListener("click",()=>{
    selectedCategory=b.dataset.category;
    renderProducts();
   });
  });

  renderProducts();

 }catch(error){
  document.getElementById("message").textContent=
   "تعذر تحميل المنتجات. تأكد من الاتصال بقاعدة البيانات.";

  console.error(error);
 }
}

function renderProducts(){

 const list=selectedCategory==="all"
  ?products
  :products.filter(p=>p.category_id===selectedCategory);

 const box=document.getElementById("products");

 document.getElementById("message").textContent=
  list.length?"":"لا توجد منتجات في هذا القسم حاليًا";

 box.innerHTML=list.map(p=>`
  <div class="product">

   <img src="${safe(p.image_url||"")}"
    alt="${safe(p.name)}"
    onerror="this.style.display='none'">

   <h3>${safe(p.name)}</h3>

   <p>${safe(p.description||"")}</p>

   <p class="price">
    ${Number(p.price).toLocaleString("ar-EG")} جنيه
   </p>

   <button class="add"
    data-add="${safe(p.id)}"
    ${Number(p.stock_quantity)<=0?"disabled":""}>

    ${Number(p.stock_quantity)<=0
     ?"غير متوفر"
     :"أضف للسلة"}

   </button>

  </div>
 `).join("");

 box.querySelectorAll("[data-add]").forEach(b=>{
  b.addEventListener("click",()=>{
   addToCart(b.dataset.add);
  });
 });
}

function addToCart(id){

 const p=products.find(x=>x.id===id);
 if(!p)return;

 const line=cart.find(x=>x.id===id);

 if(line){
  if(line.quantity>=Number(p.stock_quantity)){
   alert("الكمية المتاحة غير كافية");
   return;
  }
  line.quantity++;
 }else{
  if(Number(p.stock_quantity)<=0){
   alert("المنتج غير متوفر");
   return;
  }

  cart.push({
   id:p.id,
   name:p.name,
   price:Number(p.price),
   quantity:1
  });
 }

 renderCart();
}

function renderCart(){

 const box=document.getElementById("cartItems");

 if(!cart.length){
  box.textContent="السلة فارغة";
 }else{
  box.innerHTML=cart.map((p,i)=>`
   <div class="cart-line">

    <span>${safe(p.name)} × ${p.quantity}</span>

    <span>
     ${(p.price*p.quantity).toLocaleString("ar-EG")} جنيه

     <button class="remove" data-remove="${i}">
      حذف
     </button>
    </span>

   </div>
  `).join("");
 }

 box.querySelectorAll("[data-remove]").forEach(b=>{
  b.addEventListener("click",()=>{
   cart.splice(Number(b.dataset.remove),1);
   renderCart();
  });
 });

 const total=cart.reduce(
  (s,p)=>s+p.price*p.quantity,0
 );

 document.getElementById("total").textContent=
  "الإجمالي: "+total.toLocaleString("ar-EG")+" جنيه";
}

/* فتح نموذج إتمام الطلب */

function checkout(){

 if(!cart.length){
  alert("السلة فارغة");
  return;
 }

 document.getElementById("checkoutModal").style.display="flex";
}

/* إغلاق نموذج إتمام الطلب */

function closeCheckout(){
 document.getElementById("checkoutModal").style.display="none";
}

/* تسجيل الطلب وإرساله إلى واتساب */

let orderSubmitting=false;

async function submitCheckout(event){
 event.preventDefault();

 if(orderSubmitting)return;

 if(!cart.length){
  alert("السلة فارغة");
  closeCheckout();
  return;
 }

 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();

 if(!name||!phone||!address){
  alert("من فضلك أكمل جميع البيانات");
  return;
 }

 const submitButton=document.querySelector(".checkout-submit");

 orderSubmitting=true;
 submitButton.disabled=true;
 submitButton.textContent="جاري تسجيل الطلب...";

 try{

  const subtotal=cart.reduce(
   (s,p)=>s+p.price*p.quantity,0
  );

  const orderItems=cart.map(p=>({
   product_id:p.id,
   name:p.name,
   price:p.price,
   quantity:p.quantity
  }));

  const {error}=await db.from("orders").insert([{
   customer_name:name,
   customer_phone:phone,
   customer_address:address,
   items:orderItems,
   subtotal:subtotal,
   delivery_fee:0,
   total:subtotal,
   status:"pending"
  }]);

  if(error)throw error;

  submitButton.textContent="تم تسجيل الطلب بنجاح ✓";

  const message=[
   "طلب جديد من ZAIN STORE",
   "الاسم: "+name,
   "الهاتف: "+phone,
   "العنوان: "+address,
   ...orderItems.map(p=>
    p.name+" × "+p.quantity+" - "+(p.price*p.quantity)+" جنيه"
   ),
   "الإجمالي: "+subtotal+" جنيه"
  ].join("\n");

  const whatsappURL=
   "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(message);

  window.location.href=whatsappURL;

 }catch(error){

  console.error(error);

  alert("حدث خطأ أثناء تسجيل الطلب. حاول مرة أخرى.");

  orderSubmitting=false;
  submitButton.disabled=false;
  submitButton.textContent="تأكيد الطلب";
 }
}

 event.preventDefault();

 if(!cart.length){
  alert("السلة فارغة");
  closeCheckout();
  return;
 }

 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();

 if(!name || !phone || !address){
  alert("من فضلك أكمل جميع البيانات");
  return;
 }

 const submitButton=document.querySelector(".checkout-submit");

 submitButton.disabled=true;
 submitButton.textContent="جاري تسجيل الطلب...";

 try{

  const subtotal=cart.reduce(
   (s,p)=>s+p.price*p.quantity,0
  );

  const orderItems=cart.map(p=>({
   product_id:p.id,
   name:p.name,
   price:p.price,
   quantity:p.quantity
  }));

  const {error}=await db.from("orders").insert([{
   customer_name:name,
   customer_phone:phone,
   customer_address:address,
   items:orderItems,
   subtotal:subtotal,
   delivery_fee:0,
   total:subtotal,
   status:"pending"
  }]);

  if(error) throw error;

  const message=[
   "طلب جديد من ZAIN STORE",
   "الاسم: "+name,
   "الهاتف: "+phone,
   "العنوان: "+address,
   ...orderItems.map(p=>
    p.name+" × "+p.quantity+" - "+(p.price*p.quantity)+" جنيه"
   ),
   "الإجمالي: "+subtotal+" جنيه"
  ].join("\n");

  window.location.href=
   "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(message);

 }catch(error){

  console.error(error);

  alert("لم يتم تسجيل الطلب. حاول مرة أخرى.");

  submitButton.disabled=false;
  submitButton.textContent="تأكيد الطلب";
 }
}

loadStore();
</script>

</body>
</html>
